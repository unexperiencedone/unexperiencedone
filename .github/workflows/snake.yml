name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # ink-and-paper palette from aakshantkumar.vercel.app
          outputs: |
            dist/snake-light.svg?color_snake=#ff1f6f&color_dots=#e9e9e4,#c9c9c2,#8a8a84,#3b3b3b,#0d0d0d&color_dot_border=#0d0d0d00
            dist/snake-dark.svg?color_snake=#ff1f6f&color_dots=#161b22,#3b3b3b,#7a7a74,#c9c9c2,#f5f5f2&color_dot_border=#0d0d0d00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
