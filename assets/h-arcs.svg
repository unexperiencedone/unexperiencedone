<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="Arcs · पर्व">
<style>@font-face{font-family:'Rozha';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Mukta';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'MuktaX';src:url(data:font/woff;base64,) format('woff');}
    .rozha{font-family:'Rozha',serif} .amita{font-family:'Amita',cursive}
    .mukta{font-family:'Mukta',sans-serif} .muktab{font-family:'MuktaB',sans-serif}
    .muktax{font-family:'MuktaX',sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .draw{stroke-dasharray:1;stroke-dashoffset:1}
    
    .slab{transform:translateX(-480px);animation:slab .75s cubic-bezier(.7,0,.2,1) .1s forwards}
    @keyframes slab{to{transform:none}}
    .en{opacity:0;animation:en .6s cubic-bezier(.22,1,.36,1) .55s forwards}
    @keyframes en{from{opacity:0;letter-spacing:22px}to{opacity:1;letter-spacing:6px}}
    .hiw{transform:translateX(-520px);animation:slab .8s cubic-bezier(.7,0,.2,1) .7s forwards}
    .brush{animation:draw .6s cubic-bezier(.7,0,.2,1) 1.35s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .meta{opacity:0;animation:fade .6s ease 1.5s forwards}
    @keyframes fade{to{opacity:1}}
    .tick{animation:tick 2.4s cubic-bezier(.7,0,.2,1) 2s infinite}
    @keyframes tick{0%,100%{transform:none}50%{transform:translateX(6px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-show{opacity:1!important;transform:none!important}.draw{stroke-dashoffset:0!important}.rm-hide{display:none}}</style>

<defs><clipPath id="hiClip"><rect class="hiw" x="470" y="0" width="520" height="112"/></clipPath><pattern id="ht" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3.5" cy="3.5" r="1.4" fill="#0d0d0d"/></pattern></defs>
<rect width="1200" height="112" fill="#f5f5f2"/>
<rect x="2" y="2" width="1196" height="108" fill="none" stroke="#0d0d0d" stroke-width="4"/>
<g class="slab">
  <polygon points="0,14 460,14 430,98 0,98" fill="#0d0d0d"/>
  <polygon points="380,14 460,14 430,98 350,98" fill="url(#ht)" opacity=".0"/>
</g>
<text class="muktax en rm-show" x="36" y="70" font-size="34" fill="#f5f5f2">ARCS</text>
<g clip-path="url(#hiClip)"><text class="rozha" x="484" y="72" font-size="50" fill="#ff1f6f">पर्व</text></g>
<path class="draw brush" pathLength="1" d="M482 86 C540 80 600 92 660 84 S760 80 800 86" fill="none" stroke="#0d0d0d" stroke-width="4" stroke-linecap="round"/>
<g class="meta rm-show">
  <text class="mono" x="1166" y="44" text-anchor="end" font-size="14" fill="#3b3b3b">p. 04 <tspan class="tick" fill="#ff1f6f">→</tspan></text>
  <text class="mukta" x="1166" y="78" text-anchor="end" font-size="18" fill="#3b3b3b">four arcs out of Kanpur</text>
</g>

</svg>
