<style>@font-face{font-family:'MuktaB';src:url(data:font/woff;base64,) format('woff');}
    .rozha{font-family:'Rozha',serif} .amita{font-family:'Amita',cursive}
    .mukta{font-family:'Mukta',sans-serif} .muktab{font-family:'MuktaB',sans-serif}
    .muktax{font-family:'MuktaX',sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .draw{stroke-dasharray:1;stroke-dashoffset:1}
    
    .w{opacity:0;animation:wIn .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes wIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .hl{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow .5s cubic-bezier(.7,0,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .wipe{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow .7s cubic-bezier(.7,0,.2,1) forwards}
    .rise{opacity:0;animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.34,1.8,.5,1) forwards}
    @keyframes pop{0%{opacity:0;transform:scale(2) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
    .ink{fill:transparent;stroke:#0d0d0d;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;
      animation:inkDraw 1.5s cubic-bezier(.35,.1,.25,1) forwards,inkFill .5s ease forwards}
    @keyframes inkDraw{to{stroke-dashoffset:0}}
    @keyframes inkFill{to{fill:#0d0d0d;stroke-width:.2}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.6);opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-show{opacity:1!important;transform:none!important}.draw{stroke-dashoffset:0!important}.rm-hide{display:none}}</style>

